[project]
name = "demand-forecast-platform"
version = "0.2.0"
description = "Hierarchical demand forecasting: multi-step reconciliation (bottom-up, top-down, MinT OLS/WLS), Croston, additive ETS, and a leakage-free rolling-origin backtest against seasonal naive. Standard library only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No numpy, no pandas, no statsmodels. Reconciliation is arithmetic and the
# backtest is a loop; the dependency would exceed the code.
dependencies = []

# `pip install -e ".[dev]"` reads this; `uv sync` reads the group below. Same list.
[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
demand-forecast = "forecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package lives in src/, so `pytest` from a fresh clone cannot import it
# without this. CI installs the package first, which hid the problem: CI was
# green while every clone failed at collection with ModuleNotFoundError.
pythonpath = ["src"]
